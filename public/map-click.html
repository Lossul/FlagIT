<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Click Challenge</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #17191c;
        --border: #2b2f33;
        --text: #f4f4f4;
        --muted: #a0a0a0;
        --accent: #f8d34f;
        --good: #22c55e;
        --bad: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
      }

      .title {
        font-size: 2rem;
        margin: 0;
      }

      .pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.25rem;
      }

      .target {
        font-size: 1.65rem;
        font-weight: 700;
        margin-top: 0.5rem;
      }

      .feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .map-wrap {
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(180deg, #14171b 0%, #0f1114 100%);
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .country {
        fill: #1f2328;
        stroke: #31353a;
        stroke-width: 0.6;
        transition: fill 0.15s ease, stroke 0.15s ease;
        cursor: pointer;
      }

      .country:hover {
        fill: #2a2f35;
        stroke: #f8d34f;
      }

      .country.correct {
        fill: #14532d;
        stroke: #22c55e;
      }

      .country.wrong {
        fill: #4c1d1d;
        stroke: #ef4444;
      }

      .controls {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 0.75rem;
      }

      button {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.45rem 1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .status {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status.streak.good {
        color: var(--good);
      }

      .status.streak.bad {
        color: var(--bad);
      }

      select {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.45rem 1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
      }

      .map-hint {
        margin-top: 0.6rem;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .country {
        outline: none;
      }

      .country:focus-visible {
        stroke: #f8d34f;
        stroke-width: 1.8;
      }

      .country-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 6;
        pointer-events: stroke;
        cursor: pointer;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="title">Map Click Challenge</h1>
        <div class="pill" id="regionPill">Region: —</div>
      </div>

      <div class="panel">
        <div class="status" id="dateLabel">Daily Target</div>
        <div class="target" id="targetLabel">Loading…</div>
        <div class="feedback" id="feedback">Click the correct country on the map.</div>
        <div class="controls">
          <button id="newTarget">Next Target</button>
          <select id="regionMode">
            <option value="region">Region</option>
            <option value="sub-region">Sub-region</option>
          </select>
          <button id="zoomIn">Zoom +</button>
          <button id="zoomOut">Zoom -</button>
          <button id="zoomReset">Reset</button>
          <div class="status streak" id="streakLabel">Streak: 0</div>
        </div>
        <div class="map-hint">Scroll to zoom, Shift + drag to pan. Keyboard: Tab to country, Enter/Space to pick.</div>
        <div id="liveStatus" class="sr-only" aria-live="polite"></div>
      </div>

      <div class="map-wrap">
        <svg id="map" viewBox="0 0 1000 520" role="img" aria-label="World Map"></svg>
      </div>
    </div>

    <script>
      let regionSets = {};
      let regionOrder = [];

      function getDayIndex(date, modulo) {
        if (modulo <= 0) return 0;
        const localDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const epoch = new Date(2024, 0, 1);
        const daysSince = Math.floor((localDate - epoch) / (1000 * 60 * 60 * 24));
        return ((daysSince % modulo) + modulo) % modulo;
      }

      function project([lon, lat], width, height) {
        const x = ((lon + 180) / 360) * width;
        const y = ((90 - lat) / 180) * height;
        return [x, y];
      }

      function ringToPath(ring, width, height) {
        return ring
          .map((point, index) => {
            const [x, y] = project(point, width, height);
            return `${index === 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`;
          })
          .join(" ") + " Z";
      }

      function polygonToPath(coords, width, height) {
        return coords.map((ring) => ringToPath(ring, width, height)).join(" ");
      }

      function featureToPath(feature, width, height) {
        const { type, coordinates } = feature.geometry;
        if (type === "Polygon") return polygonToPath(coordinates, width, height);
        if (type === "MultiPolygon") {
          return coordinates.map((poly) => polygonToPath(poly, width, height)).join(" ");
        }
        return "";
      }

      const svg = document.getElementById("map");
      const targetLabel = document.getElementById("targetLabel");
      const feedback = document.getElementById("feedback");
      const regionPill = document.getElementById("regionPill");
      const streakLabel = document.getElementById("streakLabel");
      const dateLabel = document.getElementById("dateLabel");
      const newTargetButton = document.getElementById("newTarget");
      const zoomInButton = document.getElementById("zoomIn");
      const zoomOutButton = document.getElementById("zoomOut");
      const zoomResetButton = document.getElementById("zoomReset");
      const regionModeSelect = document.getElementById("regionMode");
      const liveStatus = document.getElementById("liveStatus");

      const PREFS_KEY = "geo-map-click-prefs";
      const SESSION_PREFIX = "geo-map-click-session";
      let streak = 0;
      let streakTone = "";
      let targetCode = "";
      let targetName = "";
      let featureIndex = 0;
      let featuresByCode = {};
      let currentRegion = "";
      let regionMode = "region";
      let dateKey = "";
      let regionByCode = {};
      let subRegionByCode = {};
      let mapGroup = null;
      let zoom = 1;
      let panX = 0;
      let panY = 0;
      let isPanning = false;
      let panStartX = 0;
      let panStartY = 0;

      function readStorageJSON(key, fallback) {
        try {
          const raw = window.localStorage.getItem(key);
          if (!raw) return fallback;
          return JSON.parse(raw);
        } catch (error) {
          return fallback;
        }
      }

      function writeStorageJSON(key, value) {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
          // Ignore storage failures.
        }
      }

      function getSessionKey() {
        return `${SESSION_PREFIX}-${dateKey}-${regionMode}-${currentRegion}`;
      }

      function updateStreakLabel() {
        streakLabel.textContent = `Streak: ${streak}`;
        streakLabel.classList.remove("good", "bad");
        if (streakTone === "good") streakLabel.classList.add("good");
        if (streakTone === "bad") streakLabel.classList.add("bad");
      }

      function announce(text) {
        liveStatus.textContent = text;
      }

      function savePrefs() {
        writeStorageJSON(PREFS_KEY, {
          regionMode,
          zoom,
          panX,
          panY,
        });
      }

      function saveSession() {
        if (!dateKey || !currentRegion) return;
        writeStorageJSON(getSessionKey(), {
          featureIndex,
          targetCode,
          streak,
          streakTone,
        });
      }

      function restoreSession() {
        const saved = readStorageJSON(getSessionKey(), null);
        if (!saved) return;
        if (typeof saved.featureIndex === "number" && Number.isFinite(saved.featureIndex)) {
          featureIndex = Math.max(0, Math.floor(saved.featureIndex));
        }
        if (typeof saved.streak === "number" && Number.isFinite(saved.streak)) {
          streak = Math.max(0, Math.floor(saved.streak));
        }
        if (saved.streakTone === "good" || saved.streakTone === "bad") {
          streakTone = saved.streakTone;
        } else {
          streakTone = "";
        }
        updateStreakLabel();
      }

      function setTarget() {
        const codes = regionSets[currentRegion] || Object.keys(featuresByCode);
        if (!codes || codes.length === 0) return;
        targetCode = codes[featureIndex % codes.length];
        const feature = featuresByCode[targetCode];
        targetName = feature ? feature.properties.name : targetCode;
        targetLabel.textContent = `Click ${targetName}`;
        feedback.textContent = "Click the correct country on the map.";
        announce(`Target: ${targetName}.`);
        clearHighlights();
        updateKeyboardTargets();
        saveSession();
      }

      function clearHighlights() {
        svg.querySelectorAll(".country").forEach((path) => {
          path.classList.remove("correct", "wrong");
        });
      }

      function updateKeyboardTargets() {
        const activeCodes = new Set(regionSets[currentRegion] || []);
        svg.querySelectorAll(".country").forEach((path) => {
          const code = path.dataset.code;
          const inActiveRegion = activeCodes.has(code);
          path.setAttribute("tabindex", inActiveRegion ? "0" : "-1");
          path.setAttribute("aria-disabled", inActiveRegion ? "false" : "true");
        });
      }

      newTargetButton.addEventListener("click", () => {
        featureIndex += 1;
        setTarget();
      });

      function evaluateGuess(clickedCode, clickedName) {
        if (!clickedCode) return;
        const clickedCountryName = clickedName || clickedCode;
        console.log(clickedCountryName);

        if (clickedCode === targetCode) {
          const clickedPath = svg.querySelector(`.country[data-code="${clickedCode}"]`);
          if (clickedPath) clickedPath.classList.add("correct");
          feedback.textContent = `Correct! ${clickedCountryName} was the target.`;
          announce(`Correct. ${clickedCountryName} matched the target.`);
          streak += 1;
          streakTone = "good";
          updateStreakLabel();
          featureIndex += 1;
          setTarget();
        } else {
          const clickedPath = svg.querySelector(`.country[data-code="${clickedCode}"]`);
          if (clickedPath) clickedPath.classList.add("wrong");
          feedback.textContent = `Incorrect — that was ${clickedCountryName}.`;
          announce(`Incorrect. You selected ${clickedCountryName}.`);
          streak = 0;
          streakTone = "bad";
          updateStreakLabel();
          saveSession();
        }
      }

      function onCountryClick(event) {
        const path = event.currentTarget;
        evaluateGuess(path.dataset.code, path.dataset.name);
      }

      function formatDate(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const dd = String(date.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      function buildRegionSets() {
        const source = regionMode === "sub-region" ? subRegionByCode : regionByCode;
        regionSets = {};
        Object.keys(featuresByCode).forEach((code) => {
          const region = source[code];
          if (!region) return;
          if (!regionSets[region]) regionSets[region] = [];
          regionSets[region].push(code);
        });

        regionOrder = Object.keys(regionSets).sort();
        if (regionOrder.length === 0) {
          regionOrder = ["World"];
          regionSets["World"] = Object.keys(featuresByCode);
        }
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function applyTransform() {
        if (!mapGroup) return;
        mapGroup.setAttribute("transform", `translate(${panX} ${panY}) scale(${zoom})`);
      }

      async function initMap() {
        const savedPrefs = readStorageJSON(PREFS_KEY, {});
        if (savedPrefs.regionMode === "region" || savedPrefs.regionMode === "sub-region") {
          regionMode = savedPrefs.regionMode;
        }
        if (typeof savedPrefs.zoom === "number" && Number.isFinite(savedPrefs.zoom)) {
          zoom = clamp(savedPrefs.zoom, 1, 6);
        }
        if (typeof savedPrefs.panX === "number" && Number.isFinite(savedPrefs.panX)) {
          panX = savedPrefs.panX;
        }
        if (typeof savedPrefs.panY === "number" && Number.isFinite(savedPrefs.panY)) {
          panY = savedPrefs.panY;
        }
        regionModeSelect.value = regionMode;

        const [geoResponse, regionResponse] = await Promise.all([
          fetch("/world.geojson"),
          fetch("/country-regions.json"),
        ]);
        const geojson = await geoResponse.json();
        const regionData = await regionResponse.json();
        const width = 1000;
        const height = 520;

        featuresByCode = {};
        regionByCode = {};
        subRegionByCode = {};
        regionData.forEach((entry) => {
          const code = entry["alpha-2"];
          if (!code) return;
          regionByCode[code] = entry.region || "";
          subRegionByCode[code] = entry["sub-region"] || "";
        });

        mapGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        mapGroup.setAttribute("id", "mapGroup");
        svg.appendChild(mapGroup);

        geojson.features.forEach((feature) => {
          const code = feature.properties["ISO3166-1-Alpha-2"];
          featuresByCode[code] = feature;

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", featureToPath(feature, width, height));
          path.setAttribute("class", "country");
          path.setAttribute("data-name", feature.properties.name);
          path.setAttribute("data-code", code);
          path.setAttribute("role", "button");
          path.setAttribute("tabindex", "0");
          path.setAttribute("aria-label", `Pick ${feature.properties.name}`);
          path.addEventListener("click", onCountryClick);
          path.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              onCountryClick({ currentTarget: path });
            }
          });

          const hitPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
          hitPath.setAttribute("d", featureToPath(feature, width, height));
          hitPath.setAttribute("class", "country-hit");
          hitPath.setAttribute("data-name", feature.properties.name);
          hitPath.setAttribute("data-code", code);
          hitPath.addEventListener("click", onCountryClick);

          mapGroup.appendChild(path);
          mapGroup.appendChild(hitPath);
        });

        const now = new Date();
        dateKey = formatDate(now);
        buildRegionSets();

        const regionIndex = getDayIndex(now, regionOrder.length);
        currentRegion = regionOrder[regionIndex];
        const regionCodes = regionSets[currentRegion] || [];
        featureIndex = getDayIndex(now, regionCodes.length);
        restoreSession();

        regionPill.textContent = `${regionMode === "sub-region" ? "Sub-region" : "Region"}: ${currentRegion}`;
        dateLabel.textContent = `Daily Target • ${dateKey}`;
        applyTransform();
        setTarget();
      }

      zoomInButton.addEventListener("click", () => {
        zoom = clamp(zoom * 1.2, 1, 6);
        applyTransform();
        savePrefs();
      });

      zoomOutButton.addEventListener("click", () => {
        zoom = clamp(zoom / 1.2, 1, 6);
        applyTransform();
        savePrefs();
      });

      zoomResetButton.addEventListener("click", () => {
        zoom = 1;
        panX = 0;
        panY = 0;
        applyTransform();
        savePrefs();
      });

      svg.addEventListener("wheel", (event) => {
        event.preventDefault();
        const delta = event.deltaY < 0 ? 1.1 : 0.9;
        zoom = clamp(zoom * delta, 1, 6);
        applyTransform();
        savePrefs();
      }, { passive: false });

      svg.addEventListener("pointerdown", (event) => {
        if (!event.shiftKey) return;
        isPanning = true;
        panStartX = event.clientX;
        panStartY = event.clientY;
        svg.setPointerCapture(event.pointerId);
      });

      svg.addEventListener("pointermove", (event) => {
        if (!isPanning) return;
        const dx = event.clientX - panStartX;
        const dy = event.clientY - panStartY;
        panStartX = event.clientX;
        panStartY = event.clientY;
        panX += dx;
        panY += dy;
        applyTransform();
        savePrefs();
      });

      svg.addEventListener("pointerup", (event) => {
        if (!isPanning) return;
        isPanning = false;
        svg.releasePointerCapture(event.pointerId);
      });

      svg.addEventListener("pointerleave", () => {
        isPanning = false;
      });

      regionModeSelect.addEventListener("change", () => {
        regionMode = regionModeSelect.value;
        buildRegionSets();
        const now = new Date();
        const regionIndex = getDayIndex(now, regionOrder.length);
        currentRegion = regionOrder[regionIndex];
        featureIndex = getDayIndex(now, regionSets[currentRegion].length);
        regionPill.textContent = `${regionMode === "sub-region" ? "Sub-region" : "Region"}: ${currentRegion}`;
        streak = 0;
        streakTone = "";
        restoreSession();
        savePrefs();
        setTarget();
      });

      initMap();
    </script>
  </body>
</html>
